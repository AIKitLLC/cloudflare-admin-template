name: nexus-e2e

# The `nexus` Playwright project against the private AIKitLLC/nexus-crm (docs/e2e.md, "Nexus CRM on
# CI"; ADR 0001). Pull requests and pushes run the commit pinned in .github/nexus-crm.ref, raised by
# a pull request, so a Nexus change cannot turn an unrelated template pull request red. The daily run
# uses nexus-crm `main`, so a contract change on either side shows up within a day.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secrets cannot be read in a job-level `if`. Forks, Dependabot, and this repository before the
  # deploy key exists have no NEXUS_CRM_DEPLOY_KEY: skip with a notice instead of failing.
  key:
    runs-on: ubuntu-24.04
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.NEXUS_CRM_DEPLOY_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NEXUS_CRM_DEPLOY_KEY is not available to this run; the Nexus E2E project is skipped (docs/e2e.md)."
          fi

  e2e:
    needs: key
    if: needs.key.outputs.present == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ref
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "nexus=main" >> "$GITHUB_OUTPUT"
          else
            echo "nexus=$(tr -d '[:space:]' < .github/nexus-crm.ref)" >> "$GITHUB_OUTPUT"
          fi
      # Inside the workspace (checkout requires it), in a hidden folder nothing else in this job reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AIKitLLC/nexus-crm
          ref: ${{ steps.ref.outputs.nexus }}
          path: .nexus-crm
          ssh-key: ${{ secrets.NEXUS_CRM_DEPLOY_KEY }}
          persist-credentials: false
      - run: echo "::notice::nexus-crm at $(git -C .nexus-crm rev-parse HEAD)"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --no-audit --no-fund
        working-directory: .nexus-crm
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Same apt guard as ci.yml (a stalled Azure mirror otherwise costs minutes per package).
      - name: Make apt give up on a stalled mirror quickly
        run: |
          {
            echo 'Acquire::Retries "5";'
            echo 'Acquire::http::Timeout "15";'
            echo 'Acquire::https::Timeout "15";'
          } | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 8
      - run: pnpm test:e2e --project nexus
        env:
          E2E_NEXUS_DIR: ${{ github.workspace }}/.nexus-crm
          E2E_EXTRA_INSTANCE: '0'
      - if: always()
        run: node scripts/e2e/check-log-secrets.mjs
      - if: failure()
        run: node scripts/e2e/redact-artifacts.mjs
      # This repository is public, so its artifacts are too. The Nexus Worker's own log is left out:
      # its stack traces can quote nexus-crm source.
      - if: failure()
        run: rm -f .wrangler/e2e-logs/worker-nexus-crm.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-nexus
          path: |
            playwright-report/
            test-results/
            .wrangler/e2e-logs/
          include-hidden-files: true
          retention-days: 7
