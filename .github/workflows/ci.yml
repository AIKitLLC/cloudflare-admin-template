name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: scripts/ci-local.sh --maxWorkers 2

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The Azure Ubuntu mirror sometimes stalls on a package; apt then waits 120 s per attempt, which
      # took this step from ~15 s to 6-13 minutes in 6 of 15 runs. A short timeout plus retries
      # drops a stalled connection fast and asks again.
      - name: Make apt give up on a stalled mirror quickly
        run: |
          {
            echo 'Acquire::Retries "5";'
            echo 'Acquire::http::Timeout "15";'
            echo 'Acquire::https::Timeout "15";'
          } | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 8
      - run: pnpm test:e2e
      # The Worker log is redacted as it is written; this fails the job, and removes the log so the
      # upload below cannot publish it, if anything the redaction rules mask is still in it.
      - if: always()
        run: node scripts/e2e/check-log-secrets.mjs
      # The traces, the HTML report and the text next to them hold every request the tests made. This
      # masks tokens and passwords in them, and removes what it cannot make clean, before the upload.
      - if: failure()
        run: node scripts/e2e/redact-artifacts.mjs
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            .wrangler/e2e-logs/
          # `.wrangler` is a hidden folder, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 7
